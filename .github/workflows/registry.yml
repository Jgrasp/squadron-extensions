name: Registry

on:
  push:
    branches: [main]
    paths: [registry.json]
  pull_request:
    paths: [registry.json]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-${{ github.event_name == 'pull_request' && github.ref || 'main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      todo: ${{ steps.plan.outputs.todo }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/plan.mjs >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.todo != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.plan.outputs.todo) }}
    env:
      ID: ${{ matrix.entry.id }}
      VERSION: ${{ matrix.entry.version }}
      REPOSITORY: ${{ matrix.entry.repository }}
      COMMIT: ${{ matrix.entry.commit }}
      SUBDIR: ${{ matrix.entry.path }}
      SOURCE: source
      KEEP_GOING: ${{ github.event_name != 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: registry
          persist-credentials: false
      - name: Fetch the extension at its commit
        run: |
          git init -q source
          git -C source fetch -q --depth 1 "$REPOSITORY" "$COMMIT"
          git -C source checkout -q FETCH_HEAD
      - run: rustup target add wasm32-wasip2
      - name: Build and pack
        run: node registry/scripts/pack.mjs
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.entry.id }}
          path: |
            out/*.tar.gz
            out/*.meta.json
            out/*.rejected.json
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: always() && github.event_name != 'pull_request' && needs.plan.result == 'success' && needs.plan.outputs.todo != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - run: mkdir -p out
      - name: Release the archives and update the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs
      - name: Commit the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.json rejected.json
          git diff --cached --quiet || git commit -m "Update the index"
          git push
